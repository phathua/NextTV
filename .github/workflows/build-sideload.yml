name: Build NextTV Sideload APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-sideload:
    name: Build Sideload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK and CMake
        run: |
          echo "Cài đặt NDK 25.1.8937393 và CMake 3.22.1..."
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          chmod +x gradlew
          chmod +x tools/sh/*.sh

      - name: Run Unit Tests
        run: ./gradlew testSideloadDebugUnitTest

      - name: Build Sideload Release APKs
        run: ./gradlew assembleSideloadRelease

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NextTV-Sideload-APKs
          path: app/build/outputs/apk/sideload/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APKs to GitHub Release (Tag build)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" app/build/outputs/apk/sideload/release/*.apk --clobber
