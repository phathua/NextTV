plugins {
    id 'com.android.application'
}

android {
    namespace 'com.next.tv.launcher'
    compileSdk 35
    ndkVersion '25.1.8937393'

    defaultConfig {
        applicationId 'com.next.tv.launcher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'distribution'
    productFlavors {
        sideload {
            dimension 'distribution'
            buildConfigField "boolean", "ENABLE_LOCAL_ADB", "true"
            buildConfigField "boolean", "ALLOW_APK_INSTALL", "true"
            buildConfigField "boolean", "USE_MANAGE_STORAGE", "true"
            buildConfigField "boolean", "ALLOW_WIFI_LOCATION", "true"
        }
        play {
            dimension 'distribution'
            buildConfigField "boolean", "ENABLE_LOCAL_ADB", "false"
            buildConfigField "boolean", "ALLOW_APK_INSTALL", "false"
            buildConfigField "boolean", "USE_MANAGE_STORAGE", "false"
            buildConfigField "boolean", "ALLOW_WIFI_LOCATION", "false"
        }
    }

    signingConfigs {
        release {
            def ksFile = rootProject.file('keystore/nexttv-release.keystore')
            def localProps = new Properties()
            def localPropsFile = rootProject.file('local.properties')
            if (localPropsFile.exists()) {
                localPropsFile.withInputStream { localProps.load(it) }
            }
            def ksPass = System.getenv('NEXTTV_KEYSTORE_PASSWORD') ?: localProps.getProperty('KEYSTORE_PASSWORD') ?: project.findProperty('KEYSTORE_PASSWORD')
            def kAlias = System.getenv('NEXTTV_KEY_ALIAS') ?: localProps.getProperty('KEY_ALIAS') ?: project.findProperty('KEY_ALIAS') ?: 'nexttv'
            def kPass = System.getenv('NEXTTV_KEY_PASSWORD') ?: localProps.getProperty('KEY_PASSWORD') ?: project.findProperty('KEY_PASSWORD') ?: ksPass

            if (ksFile.exists() && ksPass) {
                storeFile ksFile
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            } else {
                storeFile signingConfigs.debug.storeFile
                storePassword signingConfigs.debug.storePassword
                keyAlias signingConfigs.debug.keyAlias
                keyPassword signingConfigs.debug.keyPassword
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                output.versionCodeOverride = defaultConfig.versionCode * 10 +
                    (abi == 'armeabi-v7a' ? 1 : abi == 'arm64-v8a' ? 2 : 0)
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.register('generateNativeSecretsHeader', Exec) {
    workingDir rootProject.projectDir
    if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'tools/ps/generate_header.ps1'
    } else {
        commandLine 'bash', 'tools/sh/generate_header.sh'
    }
}

preBuild.dependsOn(generateNativeSecretsHeader)

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
